<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gang · mission control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
<style>
  /* Azuki: near-black ink, the signature red #dd323f, warm bone text, paper highlight.
     Type system — 3 families, one scale:
       Anton (display)  → brand only: logo + section titles, large
       system UI        → all functional text + labels
       mono             → data: timestamps, paths, log bodies
     Scale: 22 logo / 18 titles+counts / 14 names / 13 routes+body / 11 meta+time / 10 labels */
  :root {
    --ink:#0a0a0a; --ink-2:#111111; --ink-3:#161616; --line:#262626;
    --red:#dd323f; --red-tint:rgba(221,50,63,.12); --paper:#ebebe6;
    --bone:#e8e6df; --fg:#ededed; --muted:#8a877d; --muted-2:#56544c;
    --amber:#f0a000; --green:#16a34a;
    --display:"Anton","Arial Narrow","Helvetica Neue",Impact,sans-serif;
    --ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease-out:cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing:border-box; }
  ::selection { background:var(--red); color:#fff; }
  body {
    margin:0; height:100vh; overflow:hidden;
    display:grid; grid-template-rows:auto 1fr;
    font:13px/1.5 var(--ui); background:var(--ink); color:var(--fg);
    -webkit-font-smoothing:antialiased;
  }
  /* shared micro-label: replaces the old pixel font everywhere labels appear */
  .lbl { font:600 10px/1 var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }

  /* ── command bar ─────────────────────────────────────────────── */
  .topbar {
    display:flex; align-items:center; gap:16px; padding:0 18px; height:56px;
    background:radial-gradient(120% 180% at 0% -40%, rgba(221,50,63,.22), transparent 60%), var(--ink);
    border-bottom:2px solid var(--red);
  }
  .logo {
    font-family:var(--display); font-size:22px; letter-spacing:1px; color:var(--paper);
    background:var(--red); padding:5px 12px 3px; border-radius:2px; line-height:1;
  }
  .kicker {
    font:600 11px/1 var(--ui); letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
    padding-left:14px; border-left:1px solid var(--line); height:20px; display:flex; align-items:center;
  }
  .spacer { flex:1; }
  .stat { display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
  .stat .v { font:600 18px/1 var(--ui); color:var(--bone); font-variant-numeric:tabular-nums; }
  .conn {
    display:inline-flex; align-items:center; gap:8px;
    padding:7px 11px; border:1px solid var(--line); border-radius:2px; background:var(--ink-2);
  }
  #dot { width:7px; height:7px; border-radius:50%; background:var(--muted-2); transition:background-color .25s ease, box-shadow .25s ease; }
  .conn.live { border-color:rgba(221,50,63,.5); }
  .conn.live .lbl { color:var(--bone); }
  .conn.live #dot { background:var(--red); box-shadow:0 0 9px var(--red); animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }

  /* ── body split ──────────────────────────────────────────────── */
  .main { display:grid; grid-template-columns:304px 1fr; overflow:hidden; }
  .sec-head {
    position:sticky; top:0; z-index:2; display:flex; align-items:baseline; gap:10px;
    padding:15px 18px 12px; background:var(--ink-2); border-bottom:1px solid var(--line);
  }
  .sec-head h2 { margin:0; font-family:var(--display); font-size:18px; letter-spacing:1.5px; text-transform:uppercase; color:var(--bone); }
  .sec-head .n { margin-left:auto; font-family:var(--display); font-size:18px; color:var(--red); font-variant-numeric:tabular-nums; }
  .sec-head .hist { margin-left:auto; display:inline-flex; gap:9px; align-self:center; font:600 12px/1 var(--mono); font-variant-numeric:tabular-nums; }

  /* ── roster ──────────────────────────────────────────────────── */
  aside { background:var(--ink-2); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  #members { flex:1; overflow-y:auto; }
  .member { position:relative; padding:13px 16px 13px 18px; border-bottom:1px solid var(--line); transition:background-color .15s ease; }
  .member::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent; }
  @media (hover:hover) and (pointer:fine) { .member:hover { background:var(--ink-3); } }
  .member.tool::before, .member.thinking::before { background:var(--red); }
  .member.idle::before { background:var(--muted-2); }
  .member .name { font:600 14px/1.2 var(--ui); letter-spacing:.3px; text-transform:uppercase; color:var(--fg); }
  .member .meta { font:11px/1.4 var(--mono); color:var(--muted); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge {
    float:right; font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase;
    padding:4px 8px; border-radius:2px; background:var(--ink-3); color:var(--muted); border:1px solid var(--line);
  }
  .badge.thinking { color:#1a1205; background:var(--amber); border-color:var(--amber); }
  .badge.tool { color:var(--paper); background:var(--red); border-color:var(--red); }
  .badge.idle { color:var(--green); border-color:rgba(22,163,74,.4); }
  .rail-foot { padding:10px 16px; border-top:1px solid var(--line); }
  .rail-foot .lbl { color:var(--muted-2); }

  /* ── feed ────────────────────────────────────────────────────── */
  main { display:flex; flex-direction:column; overflow:hidden; }
  #feed { flex:1; overflow-y:auto; }
  .msg { padding:12px 18px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:72px 1fr; gap:14px; animation:msg-in 180ms var(--ease-out) both; }
  @keyframes msg-in { from { opacity:0; transform:translateY(-4px); } }
  .msg.await { background:var(--red-tint); box-shadow:inset 3px 0 0 var(--red); }
  .msg .t { font:11px/1.4 var(--mono); color:var(--muted-2); padding-top:2px; font-variant-numeric:tabular-nums; }
  .route { font:600 13px/1.3 var(--ui); letter-spacing:.3px; text-transform:uppercase; }
  .route .from { color:var(--bone); }
  .route .arrow { color:var(--muted-2); margin:0 5px; }
  .route .to { color:var(--red); }
  .await-tag { font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--red); border:1px solid rgba(221,50,63,.5); border-radius:2px; padding:3px 6px; margin-left:9px; }
  .text { font:13px/1.6 var(--mono); white-space:pre-wrap; word-break:break-word; margin-top:6px; color:var(--bone); }

  /* ── empty states ────────────────────────────────────────────── */
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:64px 24px; }
  .empty .empty-h { font-family:var(--display); font-size:18px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  .empty .empty-s { font:600 11px/1 var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2); margin-top:9px; }

  ::-webkit-scrollbar { width:9px; }
  ::-webkit-scrollbar-thumb { background:var(--line); }
  ::-webkit-scrollbar-thumb:hover { background:var(--red); }

  @media (max-width:720px) {
    .main { grid-template-columns:1fr; grid-template-rows:40% 1fr; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg { animation:none; }
    .conn.live #dot { animation:none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">GANG</span>
    <span class="kicker">Mission Control</span>
    <span class="spacer"></span>
    <div class="stat"><span class="v" id="mcount">0</span><span class="lbl">Members</span></div>
    <div class="stat"><span class="v" id="fcount">0</span><span class="lbl">Signals</span></div>
    <span class="conn" id="conn"><span id="dot"></span><span class="lbl" id="conn-label">Offline</span></span>
  </div>

  <div class="main">
    <aside>
      <div class="sec-head"><h2>The Squad</h2><span class="hist" id="hist"></span><span class="n" id="mn">0</span></div>
      <div id="members"></div>
      <div class="rail-foot"><span class="lbl">:7717 · intercom bus</span></div>
    </aside>
    <main>
      <div class="sec-head"><h2>The Wire</h2><span class="n" id="fn">0</span></div>
      <div id="feed"></div>
    </main>
  </div>

<script>
const EMPTY_MEMBERS = '<div class="empty"><div class="empty-h">The garden is empty</div><div class="empty-s">spawn a member to begin</div></div>';
const EMPTY_FEED    = '<div class="empty"><div class="empty-h">The wire is quiet</div><div class="empty-s">listening for transmissions</div></div>';

const members = new Map();           // sessionId -> SessionInfo
const membersEl = document.getElementById("members");
const feedEl = document.getElementById("feed");
const conn = document.getElementById("conn");
const connLabel = document.getElementById("conn-label");
let msgCount = 0;

function setCount(id, n){ document.getElementById(id).textContent = n; }
function short(s){ return (s||"").slice(0,8); }
function statusClass(st){
  st = st || "";
  if (st.startsWith("tool:")) return "tool";
  if (st.startsWith("thinking")) return "thinking";
  if (st.startsWith("idle")) return "idle";
  return "";
}
function statusLabel(st){
  st = st || "—";
  if (st.startsWith("tool:")) return st.slice(5) || "tool";   // CSS uppercases
  if (st.startsWith("thinking")) return "thinking";
  if (st.startsWith("idle")) return "idle";
  return st;
}
function fmtDur(ms){
  const s = Math.floor(ms/1000); if (s < 60) return s+"s";
  const m = Math.floor(s/60);    if (m < 60) return m+"m";
  const h = Math.floor(m/60);    if (h < 24) return h+"h";
  return Math.floor(h/24)+"d";
}
function renderHist(){
  let tool=0, think=0, idle=0, other=0;
  for (const s of members.values()){
    const st = s.status || "";
    if (st.startsWith("tool:")) tool++;
    else if (st.startsWith("thinking")) think++;
    else if (st.startsWith("idle")) idle++;
    else other++;
  }
  const chip = (n,sym,col) => n ? `<span style="color:${col}">${sym}${n}</span>` : "";
  document.getElementById("hist").innerHTML =
    chip(tool,"◆","var(--red)") + chip(think,"◐","var(--bone)") +
    chip(idle,"●","var(--muted-2)") + chip(other,"·","var(--muted)");
}
function renderMembers(){
  setCount("mcount", members.size); setCount("mn", members.size);
  renderHist();
  if (members.size === 0){ membersEl.innerHTML = EMPTY_MEMBERS; return; }
  const now = Date.now();
  membersEl.innerHTML = "";
  for (const s of members.values()){
    const el = document.createElement("div");
    const st = s.status || "—";
    const cls = statusClass(st);
    el.className = "member " + cls;

    const badge = document.createElement("span");
    badge.className = "badge " + cls;
    badge.textContent = statusLabel(st);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = s.name || short(s.id);

    const meta = document.createElement("div");
    meta.className = "meta";
    const cwd = (s.cwd || "").replace(/^.*\//, "…/");   // tail only — full path on hover
    const up = s.startedAt ? fmtDur(now - s.startedAt) : "";
    const idle = s.lastActivity ? "·"+fmtDur(now - s.lastActivity) : "";   // time since last transition
    const dur = [up, idle].filter(Boolean).join(" ");
    meta.textContent = [s.model, cwd, dur].filter(Boolean).join(" · ");
    if (s.cwd) meta.title = s.cwd;

    el.append(badge, name, meta);
    membersEl.appendChild(el);
  }
}
function addMessage(m){
  const ph = feedEl.querySelector(".empty"); if (ph) ph.remove();
  const el = document.createElement("div");
  el.className = "msg" + (m.expectsReply ? " await" : "");
  const time = new Date(m.ts || Date.now()).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  el.innerHTML =
    `<div class="t">${time}</div>` +
    `<div><div class="route"><span class="from"></span><span class="arrow">→</span><span class="to"></span>` +
      (m.expectsReply ? ' <span class="await-tag">↩ awaiting reply</span>' : "") + `</div>` +
      `<div class="text"></div></div>`;
  el.querySelector(".from").textContent = m.from || "?";
  el.querySelector(".to").textContent = m.to || "?";
  el.querySelector(".text").textContent = m.text || "";
  feedEl.prepend(el);
  setCount("fcount", ++msgCount); setCount("fn", msgCount);
}
function resetFeed(){ feedEl.innerHTML = EMPTY_FEED; msgCount = 0; setCount("fcount", 0); setCount("fn", 0); }

const es = new EventSource("/events");
es.onopen  = () => { conn.classList.add("live");    connLabel.textContent = "live"; };
es.onerror = () => { conn.classList.remove("live"); connLabel.textContent = "offline"; };
es.onmessage = (e) => {
  let ev; try { ev = JSON.parse(e.data); } catch { return; }
  switch (ev.type){
    case "snapshot":
      members.clear(); (ev.sessions||[]).forEach(s => members.set(s.id, s)); renderMembers();
      resetFeed(); (ev.feed||[]).forEach(addMessage);   // buffer is oldest→newest; each prepends → newest on top
      break;
    case "session_joined":  members.set(ev.session.id, ev.session); renderMembers(); break;
    case "presence_update": members.set(ev.session.id, ev.session); renderMembers(); break;
    case "session_left":    members.delete(ev.sessionId); renderMembers(); break;
    case "message":         addMessage(ev); break;
  }
};

renderMembers(); resetFeed();        // paint empty states before first event
setInterval(renderMembers, 1000);    // keep uptime/idle durations ticking between SSE events
</script>
</body>
</html>
