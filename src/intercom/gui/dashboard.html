<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gang · mission control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
<style>
  /* Azuki: near-black ink, signature red #dd323f, warm bone text.
     Anton = brand only (logo, section titles). System UI = labels. Mono = data. */
  :root {
    --ink:#0a0a0a; --ink-2:#111; --ink-3:#171717; --line:#262626;
    --red:#dd323f; --red-tint:rgba(221,50,63,.10); --paper:#ebebe6;
    --bone:#e8e6df; --fg:#ededed; --muted:#8a877d; --muted-2:#56544c;
    --amber:#f0a000; --green:#16a34a;
    --display:"Anton","Arial Narrow","Helvetica Neue",Impact,sans-serif;
    --ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease-out:cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing:border-box; }
  html { background:var(--ink); }
  ::selection { background:var(--red); color:#fff; }
  body {
    margin:0; height:100vh; overflow:hidden; display:grid; grid-template-rows:auto 1fr; grid-template-columns:minmax(0,1fr);
    font:13px/1.5 var(--ui); background:var(--ink); color:var(--fg); -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  .lbl { font:600 10px/1 var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .num { font-variant-numeric:tabular-nums; }

  /* ── top bar: the three numbers that matter ─────────────────── */
  .topbar {
    display:flex; align-items:center; gap:22px; padding:0 18px; height:56px;
    background:radial-gradient(120% 180% at 0% -40%, rgba(221,50,63,.22), transparent 60%), var(--ink);
    border-bottom:2px solid var(--red);
  }
  .logo { font-family:var(--display); font-size:22px; letter-spacing:1px; color:var(--paper); background:var(--red); padding:5px 12px 3px; border-radius:2px; line-height:1; }
  .kicker { font:600 11px/1 var(--ui); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding-left:14px; border-left:1px solid var(--line); height:20px; display:flex; align-items:center; }
  .spacer { flex:1; }
  .stat { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .stat .v { font:600 18px/1 var(--ui); color:var(--bone); font-variant-numeric:tabular-nums; }
  .stat.hot .v { color:var(--red); }
  button.stat { padding:4px 6px; margin:-4px -6px; border-radius:2px; }
  button.stat:active { transform:scale(.97); }
  @media (hover:hover) and (pointer:fine) { button.stat:hover { background:var(--ink-3); } }
  .conn { display:inline-flex; align-items:center; gap:8px; padding:7px 11px; border:1px solid var(--line); border-radius:2px; background:var(--ink-2); }
  #dot { width:7px; height:7px; border-radius:50%; background:var(--muted-2); }
  .conn.live { border-color:rgba(221,50,63,.5); }
  .conn.live .lbl { color:var(--bone); }
  .conn.live #dot { background:var(--red); box-shadow:0 0 9px var(--red); }

  /* ── split ───────────────────────────────────────────────────── */
  .main { display:grid; grid-template-columns:320px minmax(0,1fr); overflow:hidden; }
  .sec-head {
    position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px; min-height:50px;
    padding:10px 18px; background:var(--ink-2); border-bottom:1px solid var(--line);
  }
  .sec-head h2 { margin:0; font-family:var(--display); font-weight:400; font-size:18px; letter-spacing:1.5px; text-transform:uppercase; color:var(--bone); }
  .hist { margin-left:auto; display:inline-flex; gap:9px; font:600 12px/1 var(--mono); font-variant-numeric:tabular-nums; }

  /* ── roster ──────────────────────────────────────────────────── */
  aside { background:var(--ink-2); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  #members { flex:1; overflow-y:auto; }
  .member { position:relative; display:block; width:100%; text-align:left; padding:12px 16px 12px 18px; border-bottom:1px solid var(--line); }
  .member::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
  @media (hover:hover) and (pointer:fine) { .member:hover { background:var(--ink-3); } }
  .member.sel { background:var(--ink-3); box-shadow:inset 0 0 0 1px var(--line); }
  .member.sel::before { background:var(--bone); }
  .member.tool::before, .member.thinking::before { background:var(--red); }
  .m-top { display:flex; align-items:center; gap:8px; }
  .m-name { font:600 14px/1.2 var(--ui); letter-spacing:.3px; text-transform:uppercase; color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { margin-left:auto; flex:none; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; padding:4px 7px; border-radius:2px; color:var(--muted); border:1px solid var(--line); }
  .badge.thinking { color:#1a1205; background:var(--amber); border-color:var(--amber); }
  .badge.tool { color:var(--paper); background:var(--red); border-color:var(--red); }
  .badge.idle { color:var(--green); border-color:rgba(22,163,74,.4); }
  .owes { flex:none; font:600 10px/1 var(--ui); letter-spacing:.08em; text-transform:uppercase; color:var(--red); }
  .m-line { display:flex; gap:8px; font:11px/1.4 var(--mono); color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }
  .m-line .cwd { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .m-line .r { margin-left:auto; flex:none; }
  .warn { color:var(--amber); }
  .ctx { display:flex; align-items:center; gap:8px; margin-top:7px; font:11px/1 var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; }
  .bar { flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--muted); border-radius:2px; }
  .ctx.mid .bar i { background:var(--amber); } .ctx.mid .pct { color:var(--amber); }
  .ctx.high .bar i { background:var(--red); }  .ctx.high .pct { color:var(--red); }
  .rail-foot { padding:10px 16px; border-top:1px solid var(--line); }
  .rail-foot .lbl { color:var(--muted-2); }

  /* ── wire ────────────────────────────────────────────────────── */
  main { display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .tabs { display:inline-flex; border:1px solid var(--line); border-radius:3px; padding:2px; background:var(--ink); }
  .tab { padding:5px 10px; border-radius:2px; font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .tab .num { margin-left:5px; }
  .tab[aria-pressed="true"] { background:var(--ink-3); color:var(--bone); box-shadow:inset 0 0 0 1px var(--line); }
  .tab.hot .num { color:var(--red); }
  .chip { display:none; align-items:center; gap:6px; padding:4px 6px 4px 9px; border:1px solid var(--line); border-radius:2px; font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--bone); }
  .chip.on { display:inline-flex; }
  .chip button { color:var(--muted); padding:0 3px; font-size:13px; line-height:1; }
  #q {
    margin-left:auto; width:220px; max-width:40vw; padding:7px 10px; border-radius:2px; border:1px solid var(--line);
    background:var(--ink); color:var(--fg); font:12px/1 var(--mono); outline:none;
  }
  #q:focus { border-color:var(--muted-2); }
  #q::placeholder { color:var(--muted-2); }

  #feed { flex:1; overflow-y:auto; }
  .msg { padding:12px 18px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:64px minmax(0,1fr); gap:14px; scroll-margin-top:60px; }
  .msg.new { animation:msg-in 180ms var(--ease-out) both; }
  @keyframes msg-in { from { opacity:0; transform:translateY(-4px); } }
  .msg.open { background:var(--red-tint); box-shadow:inset 3px 0 0 var(--red); }
  .msg.stale { opacity:.45; }
  .msg.flash { box-shadow:inset 3px 0 0 var(--bone); background:var(--ink-3); }
  .t { font:11px/1.4 var(--mono); color:var(--muted-2); padding-top:2px; font-variant-numeric:tabular-nums; }
  .route { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font:600 13px/1.3 var(--ui); letter-spacing:.3px; }
  .route .who { text-transform:uppercase; }
  .route .from { color:var(--bone); } .route .to { color:var(--red); }
  .route .arrow { color:var(--muted-2); }
  .tag { font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--line); border-radius:2px; padding:3px 6px; color:var(--muted); }
  .tag.open { color:var(--red); border-color:rgba(221,50,63,.5); }
  .tag.done { color:var(--green); border-color:rgba(22,163,74,.4); }
  button.tag { position:relative; }
  button.tag::after { content:""; position:absolute; inset:-6px -2px; } /* bigger hit area */
  @media (hover:hover) and (pointer:fine) { button.tag:hover { color:var(--bone); border-color:var(--muted-2); } }
  .text { font:13px/1.6 var(--mono); white-space:pre-wrap; word-break:break-word; margin-top:6px; color:var(--bone); }
  .text.clamp { display:-webkit-box; -webkit-line-clamp:8; -webkit-box-orient:vertical; overflow:hidden; }
  .more { margin-top:4px; font:600 10px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding:4px 0; }
  @media (hover:hover) and (pointer:fine) { .more:hover { color:var(--bone); } }

  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:64px 24px; }
  .empty-h { font-family:var(--display); font-size:18px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  .empty-s { font:600 11px/1.4 var(--ui); letter-spacing:.12em; text-transform:uppercase; color:var(--muted-2); margin-top:9px; }

  ::-webkit-scrollbar { width:9px; }
  ::-webkit-scrollbar-thumb { background:var(--line); }

  @media (max-width:760px) {
    .topbar { gap:14px; padding:0 16px; } .kicker, .stat-msgs, #conn-label { display:none; } .conn { padding:9px; }
    .msg { grid-template-columns:minmax(0,1fr); gap:4px; padding:12px 16px; }
    .main { grid-template-columns:minmax(0,1fr); grid-template-rows:38% 1fr; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
    .wire-head { flex-wrap:wrap; } #q { width:100%; max-width:none; margin-left:0; }
  }
  @media (prefers-reduced-motion: reduce) { .msg.new { animation:none; } }
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">GANG</span>
    <span class="kicker">Mission Control</span>
    <span class="spacer"></span>
    <div class="stat"><span class="v" id="s-busy">0/0</span><span class="lbl">Working</span></div>
    <button class="stat" id="s-open-btn" title="Show messages still waiting on a reply"><span class="v" id="s-open">0</span><span class="lbl">Awaiting reply</span></button>
    <div class="stat stat-msgs"><span class="v" id="s-msgs">0</span><span class="lbl">Messages</span></div>
    <span class="conn" id="conn"><span id="dot"></span><span class="lbl" id="conn-label">Offline</span></span>
  </div>

  <div class="main">
    <aside>
      <div class="sec-head"><h2>The Squad</h2><span class="hist" id="hist"></span></div>
      <div id="members"></div>
      <div class="rail-foot"><span class="lbl" id="bus-label"></span></div>
    </aside>
    <main>
      <div class="sec-head wire-head">
        <h2>The Wire</h2>
        <div class="tabs">
          <button class="tab" data-view="all" aria-pressed="true">All<span class="num" id="n-all">0</span></button>
          <button class="tab" data-view="open" aria-pressed="false">Awaiting<span class="num" id="n-open">0</span></button>
        </div>
        <span class="chip" id="who-chip"><span id="who-name"></span><button id="who-clear" aria-label="Clear member filter">×</button></span>
        <input id="q" type="search" placeholder="Filter  /" autocomplete="off" spellcheck="false" />
      </div>
      <div id="feed"></div>
    </main>
  </div>

<script>
// ponytail: client-only view model; broker already sends ids, replyTo, supersedes, context usage.
const QUIET_MS = 5 * 60_000;     // busy but no transition this long → flag it
const MAX_FEED = 500;

const members = new Map();       // sessionId -> SessionInfo
let feed = [];                   // oldest → newest
const expanded = new Set();      // message ids the user expanded
let view = "all", who = null, query = "", newestId = null;
let online = false;

const $ = (id) => document.getElementById(id);
const membersEl = $("members"), feedEl = $("feed"), q = $("q");
$("bus-label").textContent = `:${location.port || "7717"} · intercom bus`;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const nameOf = (s) => s.name || (s.id || "").slice(0, 8);
const keyOf = (s) => s.name || s.id;     // what the broker puts in from/to
function kind(st){ st = st || ""; return st.startsWith("tool:") ? "tool" : st.startsWith("thinking") ? "thinking" : st.startsWith("idle") ? "idle" : ""; }
function statusLabel(st){ const k = kind(st); return k === "tool" ? (st.slice(5) || "tool") : k || st || "—"; }
function dur(ms){
  const s = Math.max(0, Math.floor(ms/1000)); if (s < 60) return s+"s";
  const m = Math.floor(s/60); if (m < 60) return m+"m";
  const h = Math.floor(m/60); return h < 24 ? h+"h" : Math.floor(h/24)+"d";
}
const tok = (n) => n >= 1000 ? Math.round(n/1000)+"k" : String(n);
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false });

/* Reply bookkeeping: which asks are answered, which are superseded by a retry/edit. */
function index(){
  const byId = new Map(), answered = new Map(), superseded = new Set();
  for (const m of feed){
    if (m.id) byId.set(m.id, m);
    if (m.replyTo) answered.set(m.replyTo, m);
    if (m.supersedes) superseded.add(m.supersedes);
    if (m.retryOf) superseded.add(m.retryOf);
  }
  const isOpen = (m) => m.expectsReply && !answered.has(m.id) && !superseded.has(m.id);
  return { byId, answered, superseded, isOpen };
}

function renderMembers(ix){
  ix = ix || index();
  const now = Date.now();
  const owed = new Map();                               // member name → open asks addressed to them
  for (const m of feed) if (ix.isOpen(m)) owed.set(m.to, (owed.get(m.to) || 0) + 1);

  let busy = 0; const h = { tool:0, thinking:0, idle:0, other:0 };
  for (const s of members.values()){ const k = kind(s.status); h[k || "other"]++; if (k === "tool" || k === "thinking") busy++; }
  $("s-busy").textContent = `${busy}/${members.size}`;
  const chip = (n, sym, col, t) => n ? `<span style="color:${col}" title="${t}">${sym}${n}</span>` : "";
  $("hist").innerHTML = chip(h.tool,"◆","var(--red)","running a tool") + chip(h.thinking,"◐","var(--amber)","thinking")
                      + chip(h.idle,"●","var(--green)","idle") + chip(h.other,"·","var(--muted)","unknown");

  if (members.size === 0){
    membersEl.innerHTML = '<div class="empty"><div class="empty-h">No one here</div><div class="empty-s">gang spawn &lt;role&gt; &lt;task&gt;</div></div>';
    return;
  }
  // Blocked first: members owing replies, then busy, then idle.
  const order = (s) => (owed.get(keyOf(s)) ? 0 : 2) + (kind(s.status) === "idle" ? 1 : 0);
  const list = [...members.values()].sort((a, b) => order(a) - order(b) || nameOf(a).localeCompare(nameOf(b)));

  membersEl.innerHTML = list.map((s) => {
    const k = kind(s.status), name = nameOf(s), key = keyOf(s), n = owed.get(key) || 0;
    const since = s.lastActivity ? now - s.lastActivity : 0;
    const quiet = (k === "tool" || k === "thinking") && since > QUIET_MS;
    const cwd = (s.cwd || "").replace(/^.*\//, "…/");
    const up = s.startedAt ? "up " + dur(now - s.startedAt) : "";
    const act = s.lastActivity ? `<span class="r${quiet ? " warn" : ""}" title="${quiet ? "busy with no status change for a while" : "since last status change"}">${quiet ? "quiet " : ""}${dur(since)}</span>` : "";
    const pct = typeof s.contextPct === "number" ? s.contextPct : null;
    const ctx = pct === null ? "" :
      `<div class="ctx ${pct >= 80 ? "high" : pct >= 60 ? "mid" : ""}" title="context window">
         <span class="pct">${pct}%</span><span class="bar"><i style="width:${Math.min(100, pct)}%"></i></span>
         <span>${s.contextTokens ? tok(s.contextTokens) : ""}${s.contextWindow ? "/" + tok(s.contextWindow) : ""}</span></div>`;
    return `<button class="member ${k}${who === key ? " sel" : ""}" data-who="${esc(key)}" title="Show messages to/from ${esc(name)}">
      <div class="m-top"><span class="m-name">${esc(name)}</span>${n ? `<span class="owes">owes ${n}</span>` : ""}<span class="badge ${k}">${esc(statusLabel(s.status))}</span></div>
      ${ctx}
      <div class="m-line"><span class="cwd" title="${esc(s.cwd)}">${esc([s.model, cwd].filter(Boolean).join(" · "))}</span>${act}</div>
      <div class="m-line"><span>${esc([up, s.tmuxPane ? "pane " + s.tmuxPane : ""].filter(Boolean).join(" · "))}</span></div>
    </button>`;
  }).join("");
}

function renderFeed(){
  const ix = index();
  const openCount = feed.filter(ix.isOpen).length;
  $("s-open").textContent = openCount; $("s-open-btn").classList.toggle("hot", openCount > 0);
  $("s-msgs").textContent = feed.length;
  $("n-all").textContent = feed.length; $("n-open").textContent = openCount;
  document.querySelector('.tab[data-view="open"]').classList.toggle("hot", openCount > 0);
  $("who-chip").classList.toggle("on", !!who); $("who-name").textContent = who ? who : "";
  renderMembers(ix);

  const ql = query.toLowerCase();
  const shown = feed.filter((m) =>
    (view !== "open" || ix.isOpen(m)) &&
    (!who || m.from === who || m.to === who) &&
    (!ql || `${m.from} ${m.to} ${m.text}`.toLowerCase().includes(ql))
  ).reverse();

  // Keep the reader's place when a message lands above them.
  const anchor = feedEl.scrollTop > 0 ? feedEl.querySelector(".msg") : null;
  const before = anchor ? anchor.offsetTop : 0;

  if (!shown.length){
    const [h, s] = feed.length === 0 ? ["The wire is quiet", online ? "listening for messages" : "waiting for the broker"]
      : view === "open" && !who && !ql ? ["Nobody is waiting", "every ask has a reply"] : ["No matches", "clear the filters to see everything"];
    feedEl.innerHTML = `<div class="empty"><div class="empty-h">${h}</div><div class="empty-s">${s}</div></div>`;
    return;
  }
  feedEl.innerHTML = shown.map((m) => {
    const open = ix.isOpen(m), reply = ix.answered.get(m.id), parent = m.replyTo && ix.byId.get(m.replyTo);
    const stale = m.id && ix.superseded.has(m.id);
    const long = (m.text || "").split("\n").length > 8 || (m.text || "").length > 900;
    const ex = expanded.has(m.id);
    const tags = [
      open ? `<span class="tag open">↩ awaiting · <span data-since="${m.ts}">${dur(Date.now() - m.ts)}</span></span>` : "",
      m.expectsReply && reply ? `<button class="tag done" data-jump="${esc(reply.id)}">replied ${dur(reply.ts - m.ts)} later</button>` : "",
      parent ? `<button class="tag" data-jump="${esc(parent.id)}">↳ re ${esc(parent.from)} ${clock(parent.ts).slice(0,5)}</button>` : "",
      m.subagent ? `<span class="tag">${esc(m.subagent.agent)} #${esc(m.subagent.index)}${m.subagent.final ? " · final" : ""}</span>` : "",
      m.retryOf ? `<span class="tag">retry</span>` : "",
      stale ? `<span class="tag">superseded</span>` : "",
    ].join("");
    return `<div class="msg${open ? " open" : ""}${stale ? " stale" : ""}${m.id && m.id === newestId ? " new" : ""}" id="m-${esc(m.id)}">
      <div class="t" title="${esc(new Date(m.ts).toLocaleString())}">${clock(m.ts)}</div>
      <div><div class="route"><span class="who from">${esc(m.from || "?")}</span><span class="arrow">→</span><span class="who to">${esc(m.to || "?")}</span>${tags}</div>
      <div class="text${long && !ex ? " clamp" : ""}">${esc(m.text)}</div>
      ${long ? `<button class="more" data-more="${esc(m.id)}">${ex ? "Show less" : "Show all"}</button>` : ""}</div>
    </div>`;
  }).join("");
  newestId = null;

  if (anchor){
    const same = document.getElementById(anchor.id);
    if (same) feedEl.scrollTop += same.offsetTop - before;
  }
}

function norm(m){ return { ...m, ts: typeof m.ts === "number" ? m.ts : Date.now() }; }

/* ── interactions ─────────────────────────────────────────────── */
function setView(v){
  view = v;
  document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-pressed", String(t.dataset.view === v)));
  renderFeed();
}
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => setView(t.dataset.view));
$("s-open-btn").onclick = () => setView(view === "open" ? "all" : "open");
$("who-clear").onclick = () => { who = null; renderFeed(); };
membersEl.onclick = (e) => {
  const b = e.target.closest("[data-who]"); if (!b) return;
  who = who === b.dataset.who ? null : b.dataset.who; renderFeed();
};
feedEl.onclick = (e) => {
  const more = e.target.closest("[data-more]");
  if (more){ const id = more.dataset.more; expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderFeed(); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump){
    let el = document.getElementById("m-" + jump.dataset.jump);
    if (!el){ view = "all"; who = null; query = ""; q.value = ""; setView("all"); el = document.getElementById("m-" + jump.dataset.jump); }
    if (!el) return;
    el.scrollIntoView({ block:"start" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
  }
};
q.oninput = () => { query = q.value.trim(); renderFeed(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === "Escape"){ q.value = ""; query = ""; who = null; q.blur(); setView("all"); }
});

/* ── live feed ────────────────────────────────────────────────── */
function setOnline(v){ online = v; $("conn").classList.toggle("live", v); $("conn-label").textContent = v ? "live" : "offline"; }
const es = new EventSource("/events");
es.onopen = () => setOnline(true);
es.onerror = () => { setOnline(false); renderFeed(); };
es.onmessage = (e) => {
  let ev; try { ev = JSON.parse(e.data); } catch { return; }
  switch (ev.type){
    case "snapshot":
      members.clear(); (ev.sessions || []).forEach((s) => members.set(s.id, s));
      feed = (ev.feed || []).map(norm);
      break;
    case "session_joined":
    case "presence_update": members.set(ev.session.id, ev.session); renderMembers(); return;
    case "session_left":    members.delete(ev.sessionId); break;
    case "message":
      feed.push(norm(ev)); if (feed.length > MAX_FEED) feed.shift();
      newestId = ev.id;
      break;
    default: return;
  }
  renderFeed();
};

renderFeed();
setInterval(() => {                          // keep durations ticking between events
  renderMembers();
  feedEl.querySelectorAll("[data-since]").forEach((el) => el.textContent = dur(Date.now() - Number(el.dataset.since)));
}, 1000);
</script>
