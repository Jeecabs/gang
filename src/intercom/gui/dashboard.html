<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gang · mission control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#080a0f; --bg2:#0b0e14; --panel:#0e121a; --card:#131925; --card-h:#18202e;
    --line:#1c2533; --line2:#27303f;
    --fg:#e7eef9; --muted:#8593a8; --dim:#525f72;
    --idle:#7ee787; --think:#ffd56b; --tool:#5cd3e0; --off:#6b7787;
    --display:"Chakra Petch", ui-monospace, monospace;
    --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; font-family:var(--mono); color:var(--fg); font-size:13px; line-height:1.5;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(92,211,224,.06), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(126,231,135,.05), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* faint telemetry grid */
  body::before {
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:44px 44px; -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 80%);
            mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 80%); opacity:.12;
  }

  /* ── top bar ───────────────────────────────────────────── */
  .bar {
    position:relative; z-index:2; display:flex; align-items:center; gap:18px;
    padding:14px 22px; border-bottom:1px solid var(--line2);
    background:linear-gradient(180deg, rgba(19,25,37,.9), rgba(11,14,20,.6)); backdrop-filter:blur(6px);
  }
  .brand { display:flex; align-items:baseline; gap:10px; font-family:var(--display); }
  .brand .hex { font-size:18px; color:var(--idle); transform:translateY(1px); }
  .brand b { font-size:17px; font-weight:700; letter-spacing:3px; }
  .brand span { font-size:11px; letter-spacing:4px; color:var(--muted); text-transform:uppercase; }
  .bar .spacer { flex:1; }
  .stat { font-family:var(--display); font-size:12px; letter-spacing:1px; color:var(--muted); }
  .stat b { color:var(--fg); font-weight:600; }
  .conn { display:flex; align-items:center; gap:8px; font-family:var(--display); letter-spacing:2px; font-size:11px; text-transform:uppercase; }
  .conn .led { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .conn.up .led { background:var(--idle); box-shadow:0 0 0 0 rgba(126,231,135,.6); animation:pulse 2s infinite; }
  .conn.up { color:var(--idle); }
  .conn.down { color:var(--dim); }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(126,231,135,.5);} 70%{box-shadow:0 0 0 7px rgba(126,231,135,0);} 100%{box-shadow:0 0 0 0 rgba(126,231,135,0);} }

  /* ── layout ────────────────────────────────────────────── */
  .grid { position:relative; z-index:1; flex:1; display:grid; grid-template-columns:300px 1fr; min-height:0; }
  .col { display:flex; flex-direction:column; min-height:0; }
  .col.left { border-right:1px solid var(--line2); background:rgba(14,18,26,.5); }
  .head {
    display:flex; align-items:center; justify-content:space-between; padding:13px 18px;
    font-family:var(--display); font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted);
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:1;
  }
  .head .n { color:var(--fg); background:var(--card-h); border:1px solid var(--line2); border-radius:999px; padding:1px 9px; font-size:11px; letter-spacing:1px; }
  .scroll { overflow-y:auto; flex:1; padding:12px; }
  .scroll::-webkit-scrollbar { width:9px; } .scroll::-webkit-scrollbar-thumb { background:var(--line2); border-radius:9px; } .scroll::-webkit-scrollbar-track { background:transparent; }

  /* ── member cards ──────────────────────────────────────── */
  .member {
    position:relative; padding:11px 13px 11px 15px; margin-bottom:9px; border-radius:9px;
    background:var(--card); border:1px solid var(--line); overflow:hidden;
  }
  .member::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--agent,#5cd3e0); }
  .member .top { display:flex; align-items:center; gap:8px; }
  .member .name { font-weight:600; font-size:14px; color:var(--agent,#fff); letter-spacing:.3px; }
  .member .glyph { font-size:11px; }
  .member .stat-pill {
    margin-left:auto; font-family:var(--display); font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    padding:2px 8px; border-radius:999px; border:1px solid currentColor;
  }
  .member .meta { color:var(--dim); font-size:11px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .s-idle{color:var(--idle);} .s-think{color:var(--think);} .s-tool{color:var(--tool);} .s-off{color:var(--off);}

  /* ── feed ──────────────────────────────────────────────── */
  .msg { padding:12px 16px; border-bottom:1px solid var(--line); animation:slidein .28s ease both; }
  .msg:hover { background:rgba(255,255,255,.015); }
  @keyframes slidein { from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:none;} }
  .msg .route { display:flex; align-items:center; gap:9px; margin-bottom:5px; }
  .pill { font-weight:600; padding:2px 10px; border-radius:6px; font-size:12px; letter-spacing:.3px;
          color:var(--agent,#fff); background:color-mix(in srgb, var(--agent,#5cd3e0) 16%, transparent);
          border:1px solid color-mix(in srgb, var(--agent,#5cd3e0) 40%, transparent); white-space:nowrap; }
  .arrow { color:var(--dim); }
  .msg .when { margin-left:auto; color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .msg .reply { color:var(--think); font-size:10px; font-family:var(--display); letter-spacing:1.5px; text-transform:uppercase;
                border:1px solid color-mix(in srgb, var(--think) 45%, transparent); border-radius:999px; padding:1px 7px; margin-left:6px; }
  .msg .body { color:var(--fg); white-space:pre-wrap; word-break:break-word; padding-left:2px; }
  .empty { color:var(--dim); padding:40px 20px; text-align:center; font-size:12px; letter-spacing:1px; }
  .empty .big { display:block; font-family:var(--display); font-size:13px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand"><span class="hex">⬡</span><b>GANG</b><span>mission&nbsp;control</span></div>
    <div class="spacer"></div>
    <div class="stat"><b id="mcount">0</b> members</div>
    <div class="stat"><b id="fcount">0</b> messages</div>
    <div class="conn down" id="conn"><span class="led"></span><span id="connlabel">offline</span></div>
  </div>

  <div class="grid">
    <div class="col left">
      <div class="head"><span>Members</span><span class="n" id="mn">0</span></div>
      <div class="scroll" id="members"><div class="empty"><span class="big">no members</span>gang spawn &lt;role&gt; &lt;task&gt;</div></div>
    </div>
    <div class="col">
      <div class="head"><span>Live Feed</span><span class="n" id="fn">0</span></div>
      <div class="scroll" id="feed"><div class="empty"><span class="big">standing by</span>waiting for messages…</div></div>
    </div>
  </div>

<script>
const members = new Map();
const palette = ["#5cd3e0","#ffd56b","#bae67e","#f792a6","#c8a6ff","#ff9e64","#73d0ff","#95e6cb","#f0a8d0","#86d98c"];
const membersEl = document.getElementById("members");
const feedEl = document.getElementById("feed");
const conn = document.getElementById("conn");
let msgCount = 0;

function agentColor(name){
  let h = 0; for (const c of (name||"?")) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}
function short(s){ return (s||"").slice(0,8); }
function statusMeta(st){
  st = st || "";
  if (st.startsWith("tool:")) return { glyph:"◆", cls:"s-tool" };
  if (st.startsWith("thinking")) return { glyph:"◐", cls:"s-think" };
  if (st.startsWith("idle")) return { glyph:"●", cls:"s-idle" };
  return { glyph:"·", cls:"s-off" };
}
function setCount(id, n){ document.getElementById(id).textContent = n; }

function renderMembers(){
  setCount("mcount", members.size); setCount("mn", members.size);
  if (members.size === 0){
    membersEl.innerHTML = '<div class="empty"><span class="big">no members</span>gang spawn &lt;role&gt; &lt;task&gt;</div>';
    return;
  }
  membersEl.innerHTML = "";
  for (const s of members.values()){
    const color = agentColor(s.name || s.id);
    const m = statusMeta(s.status);
    const el = document.createElement("div");
    el.className = "member"; el.style.setProperty("--agent", color);
    const cwd = (s.cwd||"").replace(/^.*\//, "…/");
    el.innerHTML =
      `<div class="top">`+
        `<span class="glyph ${m.cls}">${m.glyph}</span>`+
        `<span class="name">${s.name || short(s.id)}</span>`+
        `<span class="stat-pill ${m.cls}">${s.status || "—"}</span>`+
      `</div>`+
      `<div class="meta">${s.model || ""}${s.cwd ? " · "+cwd : ""}</div>`;
    membersEl.appendChild(el);
  }
}

function addMessage(msg){
  const ph = feedEl.querySelector(".empty"); if (ph) ph.remove();
  const fromC = agentColor(msg.from), toC = agentColor(msg.to);
  const time = new Date(msg.ts || Date.now()).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const el = document.createElement("div");
  el.className = "msg";
  el.innerHTML =
    `<div class="route">`+
      `<span class="pill" style="--agent:${fromC}">${msg.from}</span>`+
      `<span class="arrow">→</span>`+
      `<span class="pill" style="--agent:${toC}">${msg.to}</span>`+
      (msg.expectsReply ? `<span class="reply">awaiting reply</span>` : ``)+
      `<span class="when">${time}</span>`+
    `</div>`+
    `<div class="body"></div>`;
  el.querySelector(".body").textContent = msg.text || "";
  feedEl.prepend(el);
  setCount("fcount", ++msgCount); setCount("fn", msgCount);
}

function resetFeed(){
  feedEl.innerHTML = '<div class="empty"><span class="big">standing by</span>waiting for messages…</div>';
  msgCount = 0; setCount("fcount", 0); setCount("fn", 0);
}

const es = new EventSource("/events");
es.onopen = () => { conn.className = "conn up"; document.getElementById("connlabel").textContent = "live"; };
es.onerror = () => { conn.className = "conn down"; document.getElementById("connlabel").textContent = "offline"; };
es.onmessage = (e) => {
  let ev; try { ev = JSON.parse(e.data); } catch { return; }
  switch (ev.type){
    case "snapshot":
      members.clear(); (ev.sessions||[]).forEach(s => members.set(s.id, s)); renderMembers();
      resetFeed(); (ev.feed||[]).forEach(addMessage);   // oldest→newest; each prepends → newest on top
      break;
    case "session_joined":  members.set(ev.session.id, ev.session); renderMembers(); break;
    case "presence_update": members.set(ev.session.id, ev.session); renderMembers(); break;
    case "session_left":    members.delete(ev.sessionId); renderMembers(); break;
    case "message":         addMessage(ev); break;
  }
};
</script>
</body>
</html>
