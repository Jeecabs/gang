<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gang mission control</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* pi-tooling look: white ink on black, Archivo wide, Plex Mono utility, no accent hue.
     Anything that needs you is inverted (black on white). Everything else stays ink. */
  :root {
    --ink:#000; --paper:#f7f7f2; --graphite:#b4b4ae; --dim:#8c8c87; --rule:#2e2e2e; --panel:#121212;
    --red:#ff4d57; --amber:#ffb224;
    --sans:"Archivo",-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { background:var(--ink); }
  body {
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
    background:var(--ink); color:var(--paper); font:15px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
  }
  ::selection { background:var(--paper); color:var(--ink); }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left; }
  :focus-visible { outline:2px solid var(--paper); outline-offset:2px; }
  .num { font-variant-numeric:tabular-nums; }
  .label { font:500 11.5px/1 var(--mono); letter-spacing:.06em; color:var(--graphite); }
  .inv { background:var(--paper); color:var(--ink); }
  /* member identity: solid colour tag, black text */
  .tag { display:inline-block; padding:1px 7px 2px; background:var(--c); color:#000; font-weight:750; font-stretch:110%; line-height:1.35; overflow-wrap:anywhere; }
  .c { color:var(--c); font-weight:600; }

  /* ── top bar ─────────────────────────────────────────────────── */
  .top { flex:none; display:flex; align-items:center; gap:24px; padding:12px 20px; border-bottom:1px solid var(--rule); }
  .logo { font-weight:850; font-stretch:125%; font-size:20px; letter-spacing:-.03em; line-height:1; }
  #status { font-size:15px; color:var(--graphite); }
  #status b { color:var(--paper); font-weight:700; }
  .spacer { flex:1; }
  .stat { font:12.5px/1 var(--mono); color:var(--graphite); }
  .stat b { color:var(--paper); font-weight:600; }
  #conn.down { padding:4px 7px; margin:-4px 0; background:var(--paper); color:var(--ink); }

  /* ── needs you: inverted band, only when something is wrong ──── */
  #attn { flex:none; max-height:30vh; overflow-y:auto; }
  .alert { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; width:100%; padding:9px 20px; font-size:15px; background:var(--red); color:#fff; border-bottom:1px solid rgba(0,0,0,.25); }
  .alert.amber { background:var(--amber); color:#000; }
  .alert:last-child { border-bottom:0; }
  .alert b { font-weight:750; font-stretch:110%; }
  .alert .age { font:500 12.5px/1 var(--mono); }
  @media (hover:hover) and (pointer:fine) { .alert:hover { filter:brightness(1.08); } }
  .alert .tag { box-shadow:0 0 0 1px rgba(0,0,0,.35); }

  /* ── squad: tmux-style pane grid across the full width ───────── */
  #squad { flex:none; display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); max-height:42vh; overflow-y:auto; border-bottom:3px solid var(--paper); }
  .pane { position:relative; display:flex; flex-direction:column; gap:8px; padding:14px 20px 14px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule); cursor:pointer; min-width:0; }
  @media (hover:hover) and (pointer:fine) { .pane:hover { background:var(--panel); } }
  .pane.sel { background:var(--panel); box-shadow:inset 0 0 0 1px var(--graphite); }
  .p-top { display:flex; align-items:baseline; gap:12px; }
  .p-name { font-size:16px; letter-spacing:-.01em; }
  .p-state { margin-left:auto; flex:none; font:500 12.5px/1 var(--mono); color:var(--graphite); white-space:nowrap; }
  .p-state.busy { color:var(--paper); }
  .p-state.flag { background:var(--red); color:#fff; padding:4px 6px; margin-top:-4px; }
  .p-state.warn { background:var(--amber); color:#000; padding:4px 6px; margin-top:-4px; }
  .p-said { font-size:14px; line-height:1.5; color:var(--graphite); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .p-said.none { color:var(--dim); }
  .p-when { font:12px/1 var(--mono); color:var(--graphite); }
  .p-foot { margin-top:auto; display:flex; align-items:center; gap:14px; font:12px/1 var(--mono); color:var(--graphite); }
  .meter { display:inline-flex; align-items:center; gap:7px; }
  .meter i { position:relative; display:block; width:64px; height:4px; background:var(--rule); }
  .meter i::after { content:""; position:absolute; inset:0 auto 0 0; width:var(--p); background:var(--graphite); }
  .meter.hot { color:var(--amber); } .meter.hot i::after { background:var(--amber); }
  .copy { margin-left:auto; padding:4px 7px; border:1px solid var(--rule); font:12px/1 var(--mono); color:var(--graphite); }
  @media (hover:hover) and (pointer:fine) { .copy:hover { background:var(--paper); color:var(--ink); border-color:var(--paper); } }
  .copy:active { transform:scale(.97); }
  .squad-empty { padding:20px; color:var(--graphite); }

  /* ── conversation ────────────────────────────────────────────── */
  .convo { flex:1; min-height:0; display:flex; flex-direction:column; }
  .c-head { flex:none; display:flex; align-items:center; gap:14px; padding:10px 20px; border-bottom:1px solid var(--rule); }
  .chip { display:inline-flex; align-items:center; gap:8px; font:12.5px/1 var(--mono); padding:5px 4px 5px 9px; }
  .chip button { padding:0 5px; font-size:15px; line-height:1; }
  #q { margin-left:auto; width:260px; padding:8px 11px; background:var(--panel); border:1px solid var(--rule); color:var(--paper); font:13px/1 var(--mono); outline:none; }
  #q:focus { border-color:var(--graphite); }
  #q::placeholder { color:var(--dim); }

  #scroller { flex:1; overflow-y:auto; position:relative; }
  .msg { display:grid; grid-template-columns:260px minmax(0,1fr) 64px; gap:20px; padding:14px 20px; border-bottom:1px solid var(--rule); scroll-margin:40px; }
  .msg.stale { opacity:.45; }
  .msg.flash { background:var(--panel); }
  .who { font-size:14.5px; }
  .to { margin-top:5px; font:12px/1.4 var(--mono); color:var(--graphite); overflow-wrap:anywhere; }
  .waiting { display:inline-block; margin-top:7px; font:500 11.5px/1 var(--mono); padding:4px 6px; background:var(--red); color:#fff; }
  .text { color:var(--paper); white-space:pre-wrap; word-break:break-word; max-width:110ch; }
  .text.clamp { max-height:3.1em; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
  .msg.open { background:rgba(255,77,87,.07); }
  .time { text-align:right; font:12.5px/1.6 var(--mono); color:var(--graphite); }
  .divider { padding:7px 20px; font:500 11.5px/1 var(--mono); letter-spacing:.06em; border-bottom:1px solid var(--rule); color:var(--graphite); }
  .divider.new { background:var(--paper); color:var(--ink); border-color:var(--paper); }

  .jump { position:sticky; bottom:14px; display:none; margin:10px auto 0; width:max-content; padding:8px 12px; font:500 12.5px/1 var(--mono); box-shadow:0 0 0 4px var(--ink); }
  .jump.on { display:block; }
  .jump:active { transform:scale(.97); }
  .empty { padding:24px 20px; color:var(--graphite); }
  .empty b { color:var(--paper); font-weight:700; }

  ::-webkit-scrollbar { width:9px; }
  ::-webkit-scrollbar-thumb { background:var(--rule); }

  @media (max-width:760px) {
    .top { gap:14px; padding:12px 16px; } #status { display:none; }
    #squad { grid-template-columns:minmax(0,1fr); max-height:38vh; }
    .pane, .alert, .c-head, .msg, .divider { padding-left:16px; padding-right:16px; }
    .msg { grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; }
    .msg .text { grid-column:1 / -1; }
    #q { width:auto; flex:1; }
  }
</style>
</head>
<body>
  <div class="top">
    <span class="logo">gang</span>
    <span id="status"></span>
    <span class="spacer"></span>
    <span class="stat" id="summary"></span>
    <span class="stat" id="conn">connecting</span>
  </div>

  <div id="attn" hidden></div>
  <div id="squad"></div>

  <section class="convo">
    <div class="c-head">
      <span class="label" id="c-title">conversation</span>
      <span class="chip inv" id="who-chip" hidden><span id="who-name"></span><button id="who-clear" aria-label="Show everyone">×</button></span>
      <input id="q" type="search" placeholder="search messages  /" autocomplete="off" spellcheck="false" />
    </div>
    <div id="scroller"><div id="feed"></div><button class="jump inv" id="jump">↓ new messages</button></div>
  </section>

<script>
// ponytail: client-only view model; the broker already sends ids, replyTo, supersedes, context usage and tmux pane.
const QUIET_MS = 5 * 60_000;     // busy with no status change this long → surface it
const CTX_WARN = 80;             // context % worth interrupting for
const MAX_FEED = 500;
const SEEN_KEY = "gang:lastSeen";
// Identity colours: bright on black, none of them red or amber (those mean "needs you" / "stuck").
const PALETTE = ["#4cc9f0", "#b388ff", "#7bed9f", "#ff8fcf", "#74a8ff", "#c0eb75", "#f9f871", "#63e6be"];
const colors = new Map();

const members = new Map();       // sessionId -> SessionInfo
let feed = [];                   // oldest → newest
const expanded = new Set();
const cwds = new Map();          // member key -> last known cwd (survives the member leaving)
let who = null, query = "", online = null;
let lastSeen = 0; try { lastSeen = Number(localStorage.getItem(SEEN_KEY)) || 0; } catch {}

const $ = (id) => document.getElementById(id);
const squadEl = $("squad"), feedEl = $("feed"), scroller = $("scroller"), attnEl = $("attn"), q = $("q"), jumpBtn = $("jump");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const keyOf = (s) => s.name || s.id;                    // what the broker puts in from/to
const project = (cwd) => (cwd || "").replace(/\/+$/, "").split("/").pop();
function kind(st){ st = st || ""; return st.startsWith("tool:") ? "tool" : st.startsWith("thinking") ? "thinking" : st.startsWith("idle") ? "idle" : ""; }
function dur(ms){
  const s = Math.max(0, Math.floor(ms/1000)); if (s < 60) return s+"s";
  const m = Math.floor(s/60); if (m < 60) return m+"m";
  const h = Math.floor(m/60); return h < 24 ? h+"h" : Math.floor(h/24)+"d";
}
const tok = (n) => n >= 1000 ? Math.round(n/1000)+"k" : String(n);
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });
const nearBottom = () => scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;

/* Readable names. Generated ids ("subagent-chat-…-769a") become the project they work in;
   a short id suffix is added only when two members share a project. */
function idTail(k){ const m = /-([0-9a-f]{4,})-([0-9a-f]{4,})$/i.exec(k || ""); return m ? m[2].slice(-4).toLowerCase() : null; }
function label(k){
  const tail = idTail(k);
  if (!tail) return k || "?";                           // a real, human-chosen name
  const proj = project(cwds.get(k));
  if (!proj) return tail;
  const clash = [...cwds].some(([o, c]) => o !== k && project(c) === proj);
  return clash ? `${proj} ${tail}` : proj;
}

function color(k){ if (!colors.has(k)) colors.set(k, PALETTE[colors.size % PALETTE.length]); return colors.get(k); }
const tag = (k, cls = "") => `<span class="tag ${cls}" style="--c:${color(k)}" title="${esc(k)}">${esc(label(k))}</span>`;
const ctext = (k) => `<span class="c" style="--c:${color(k)}" title="${esc(k)}">${esc(label(k))}</span>`;

/* Open asks = expectsReply with no reply, not superseded by a retry/edit. */
function index(){
  const answered = new Set(), superseded = new Set();
  for (const m of feed){
    if (m.replyTo) answered.add(m.replyTo);
    if (m.supersedes) superseded.add(m.supersedes);
    if (m.retryOf) superseded.add(m.retryOf);
  }
  return { superseded, isOpen: (m) => m.expectsReply && !answered.has(m.id) && !superseded.has(m.id) };
}

function stateOf(s, now){
  const k = kind(s.status), since = s.lastActivity ? now - s.lastActivity : 0;
  const busy = k === "tool" || k === "thinking";
  const text = k === "tool" ? s.status.slice(5) || "tool" : k || s.status || "unknown";
  return { k, busy, text, stuck: busy && since > QUIET_MS, since };
}

/* The only things worth interrupting for, most urgent first. */
function attention(ix, now){
  const out = [];
  for (const m of feed) if (ix.isOpen(m)) out.push({
    id:m.id, age:dur(now - m.ts) + " waiting",
    level:"red", html:`${tag(m.to)} hasn't answered ${tag(m.from)}`,
  });
  for (const s of members.values()){                     // one row per member, reasons joined
    const st = stateOf(s, now), k = keyOf(s), why = [];
    if (st.stuck) why.push(`has been running ${esc(st.text)} for ${dur(st.since)} with no update`);
    if ((s.contextPct ?? 0) >= CTX_WARN) why.push(`is at ${s.contextPct}% context`);
    if (why.length) out.push({ level:"amber", focus:k, age:"", html:`${tag(k)} ${why.join(" and ")}` });
  }
  return out;
}

function render(){
  const now = Date.now(), ix = index();
  const sorted = [...members.values()].sort((a, b) => (a.startedAt || 0) - (b.startedAt || 0));
  for (const s of sorted){ cwds.set(keyOf(s), s.cwd); color(keyOf(s)); }   // colours follow join order, so they stay put

  const busy = [...members.values()].filter((s) => stateOf(s, now).busy).length;
  $("summary").innerHTML = members.size ? `<b class="num">${busy}</b>/<b class="num">${members.size}</b> working` : "";

  const items = attention(ix, now);
  attnEl.hidden = items.length === 0;
  attnEl.innerHTML = items.map((a, i) => `<button class="alert ${a.level === "amber" ? "amber" : ""}" data-i="${i}"><span>${a.html}</span><span class="age num">${a.age}</span></button>`).join("");
  attnEl._items = items;
  $("status").innerHTML = !members.size ? "No one is running."
    : items.length ? `<b>${items.length} ${items.length > 1 ? "things need" : "thing needs"} you</b>`
    : "All clear, nobody is waiting on anyone";
  document.title = items.length ? `(${items.length}) gang` : "gang mission control";

  // last thing each member said
  const lastSaid = new Map();
  for (const m of feed) lastSaid.set(m.from, m);
  const owes = new Set(feed.filter(ix.isOpen).map((m) => m.to));

  const list = [...members.values()].sort((a, b) => label(keyOf(a)).localeCompare(label(keyOf(b))));
  squadEl.innerHTML = list.length ? list.map((s) => {
    const k = keyOf(s), st = stateOf(s, now), pct = s.contextPct;
    const flag = owes.has(k) ? "owes a reply" : st.stuck ? `stuck ${dur(st.since)}` : "", flagCls = owes.has(k) ? "flag" : st.stuck ? "warn" : "";
    const state = flag || `${st.text} ${dur(st.since)}`;
    const said = lastSaid.get(k);
    const hot = (pct ?? 0) >= CTX_WARN;
    return `<div class="pane${who === k ? " sel" : ""}" data-who="${esc(k)}" title="${esc(k)}&#10;${esc(s.cwd)}">
      <div class="p-top">${tag(k, "p-name")}<span class="p-state ${flagCls || (st.busy ? "busy" : "")}">${esc(state)}</span></div>
      ${said ? `<div class="p-when">said ${dur(now - said.ts)} ago to ${ctext(said.to)}</div><div class="p-said">${esc(said.text)}</div>`
             : `<div class="p-said none">Hasn't said anything yet.</div>`}
      <div class="p-foot">
        ${typeof pct === "number" ? `<span class="meter${hot ? " hot" : ""}" title="${s.contextWindow ? `${tok(s.contextTokens || 0)} of ${tok(s.contextWindow)} tokens` : ""}"><i style="--p:${Math.min(100, pct)}%"></i>${pct}%</span>` : ""}
        <span>${esc(s.model || "")}</span>
        ${s.tmuxPane ? `<button class="copy" data-copy="tmux switch-client -t '${esc(s.tmuxPane)}'" title="Copy the tmux command that jumps to this pane">tmux ${esc(s.tmuxPane)}</button>` : ""}
      </div>
    </div>`;
  }).join("") : `<div class="squad-empty">No members yet. Spawn one with gang spawn.</div>`;

  $("who-chip").hidden = !who;
  if (who) $("who-name").textContent = label(who);
}

function renderFeed(stick){
  const ix = index(), ql = query.toLowerCase();
  const shown = feed.filter((m) =>
    (!who || m.from === who || m.to === who) &&
    (!ql || `${m.from} ${m.to} ${label(m.from)} ${label(m.to)} ${m.text}`.toLowerCase().includes(ql)));
  $("c-title").textContent = `conversation, ${shown.length} message${shown.length === 1 ? "" : "s"}`;

  const atBottom = nearBottom(), top = scroller.scrollTop;
  if (!shown.length){
    feedEl.innerHTML = feed.length ? `<div class="empty"><b>No matches.</b> Press Esc to clear the filters.</div>`
      : online === false ? `<div class="empty"><b>Can't reach the broker.</b> Start a Pi session with gang loaded.</div>`
      : `<div class="empty"><b>Quiet so far.</b> Messages between members show up here.</div>`;
  } else {
    let lastDay = new Date().toDateString(), markedNew = false;
    feedEl.innerHTML = shown.map((m) => {
      const d = new Date(m.ts), day = d.toDateString();
      let sep = "";
      if (day !== lastDay) sep += `<div class="divider">${esc(d.toLocaleDateString([], { weekday:"long", month:"short", day:"numeric" }).toLowerCase())}</div>`;
      if (!markedNew && lastSeen && m.ts > lastSeen && m !== shown[0]){ sep += `<div class="divider new">new since you last looked</div>`; markedNew = true; }
      if (lastSeen && m.ts > lastSeen) markedNew = true;
      lastDay = day;
      const open = ix.isOpen(m), ex = expanded.has(m.id);
      const long = (m.text || "").length > 240 || (m.text || "").split("\n").length > 2;
      return sep + `<div class="msg${open ? " open" : ""}${ix.superseded.has(m.id) ? " stale" : ""}" id="m-${esc(m.id)}">
        <div>
          <div>${tag(m.from, "who")}</div>
          <div class="to">to ${ctext(m.to)}</div>
          ${open ? `<span class="waiting">waiting for reply</span>` : ""}
        </div>
        <div class="text${long && !ex ? " clamp" : ""}" ${long ? `data-more="${esc(m.id)}" title="${ex ? "click to collapse" : "click to read all"}"` : ""}>${esc(long && !ex ? m.text.replace(/\s+/g, " ") : m.text)}</div>
        <div class="time num" title="${esc(d.toLocaleString())}">${clock(m.ts)}</div>
      </div>`;
    }).join("");
  }
  if (stick || atBottom){ scroller.scrollTop = scroller.scrollHeight; jumpBtn.classList.remove("on"); }
  else scroller.scrollTop = top;
}

function norm(m){ return { ...m, ts: typeof m.ts === "number" ? m.ts : Date.now() }; }

/* ── interactions ─────────────────────────────────────────────── */
function focusWho(k){ who = k; render(); renderFeed(true); }
squadEl.onclick = async (e) => {
  const c = e.target.closest("[data-copy]");
  if (c){
    try { await navigator.clipboard.writeText(c.dataset.copy); c.textContent = "copied"; }
    catch { c.textContent = "copy failed"; }
    setTimeout(render, 1200);
    return;
  }
  const p = e.target.closest("[data-who]"); if (p && !getSelection().toString()) focusWho(who === p.dataset.who ? null : p.dataset.who);
};
$("who-clear").onclick = () => focusWho(null);
attnEl.onclick = (e) => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  const a = attnEl._items[Number(b.dataset.i)];
  if (!a.id){ focusWho(a.focus); return; }
  who = null; query = ""; q.value = ""; render(); renderFeed(true);
  const el = document.getElementById("m-" + a.id); if (!el) return;
  el.scrollIntoView({ block:"center" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
};
feedEl.onclick = (e) => {
  const t = e.target.closest("[data-more]"); if (!t || getSelection().toString()) return;
  const id = t.dataset.more; expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderFeed();
};
scroller.onscroll = () => { if (nearBottom()) jumpBtn.classList.remove("on"); };
jumpBtn.onclick = () => { scroller.scrollTop = scroller.scrollHeight; jumpBtn.classList.remove("on"); };
q.oninput = () => { query = q.value.trim(); renderFeed(true); };
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  else if (e.key === "Escape"){ q.value = ""; query = ""; q.blur(); focusWho(null); }
});
// Remember when you last had the page open, for the "new since you last looked" marker.
const markSeen = () => { try { localStorage.setItem(SEEN_KEY, String(Date.now())); } catch {} };
document.addEventListener("visibilitychange", () => { if (document.hidden) markSeen(); });
addEventListener("pagehide", markSeen);

/* ── live feed ────────────────────────────────────────────────── */
function setOnline(v){ online = v; $("conn").textContent = v ? "live" : "disconnected"; $("conn").classList.toggle("down", !v); }
const es = new EventSource("/events");
es.onopen = () => setOnline(true);
es.onerror = () => { setOnline(false); renderFeed(); };
es.onmessage = (e) => {
  let ev; try { ev = JSON.parse(e.data); } catch { return; }
  switch (ev.type){
    case "snapshot":
      members.clear(); (ev.sessions || []).forEach((s) => members.set(s.id, s));
      feed = (ev.feed || []).map(norm);
      render(); renderFeed(true); return;
    case "session_joined":  members.set(ev.session.id, ev.session); render(); renderFeed(); return;   // names may resolve now
    case "presence_update": members.set(ev.session.id, ev.session); render(); return;
    case "session_left":    members.delete(ev.sessionId); render(); return;
    case "message": {
      feed.push(norm(ev)); if (feed.length > MAX_FEED) feed.shift();
      const atBottom = nearBottom();
      render(); renderFeed();
      if (!atBottom) jumpBtn.classList.add("on");
      return;
    }
  }
};

render(); renderFeed(true);
setInterval(render, 5000);   // durations and "stuck" detection; nothing here needs per-second updates
</script>
</body>
</html>
