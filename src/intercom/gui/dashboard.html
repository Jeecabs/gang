<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gang · mission control</title>
<style>
  /* Quiet by default. Red is reserved for things that need you; everything else is grey. */
  :root {
    --ink:#0b0b0b; --ink-2:#121212; --ink-3:#1a1a1a; --line:#232323;
    --red:#dd323f; --red-tint:rgba(221,50,63,.08); --paper:#ebebe6;
    --fg:#e8e6df; --text:#c9c6bd; --muted:#85827a; --muted-2:#57554e;
    --amber:#e8a33a;
    --ui:-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { background:var(--ink); }
  ::selection { background:var(--red); color:#fff; }
  body {
    margin:0; height:100vh; overflow:hidden; display:grid; grid-template-rows:auto 1fr; grid-template-columns:minmax(0,1fr);
    font:14px/1.55 var(--ui); background:var(--ink); color:var(--fg); -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:left; }
  .num { font-variant-numeric:tabular-nums; }
  .cap { font:600 12px/1 var(--ui); color:var(--muted-2); }

  /* ── top bar ─────────────────────────────────────────────────── */
  .topbar { display:flex; align-items:center; gap:14px; height:48px; padding:0 20px; border-bottom:1px solid var(--line); }
  .logo { font:700 15px/1 var(--ui); letter-spacing:-.01em; color:var(--paper); background:var(--red); padding:4px 8px; border-radius:4px; }
  .summary { color:var(--muted); font-size:13px; }
  .spacer { flex:1; }
  .conn { display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted-2); }
  .conn i { width:6px; height:6px; border-radius:50%; background:var(--muted-2); }
  .conn.live { color:var(--muted); } .conn.live i { background:#3fb96a; }
  .conn.down { color:var(--red); } .conn.down i { background:var(--red); }

  .main { display:grid; grid-template-columns:260px minmax(0,1fr); overflow:hidden; }

  /* ── squad: one line per member ──────────────────────────────── */
  aside { border-right:1px solid var(--line); overflow-y:auto; padding:14px 10px; }
  aside .cap { padding:0 10px 8px; display:block; }
  .member { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:6px; }
  @media (hover:hover) and (pointer:fine) { .member:hover { background:var(--ink-2); } }
  .member.sel { background:var(--ink-3); }
  .dot { flex:none; width:8px; height:8px; border-radius:50%; background:var(--c); }
  .m-body { min-width:0; flex:1; }
  .m-name { font-weight:600; font-size:14px; color:var(--fg); }
  .m-sub { font-size:12px; color:var(--muted-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-state { flex:none; font-size:12px; color:var(--muted); }
  .m-state.busy { color:var(--fg); }
  .m-state.warn { color:var(--amber); }
  .m-state.hot { color:var(--red); }
  .m-detail { margin:2px 10px 8px 28px; font:12px/1.6 var(--mono); color:var(--muted-2); }
  .m-detail div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ── right column ────────────────────────────────────────────── */
  main { display:flex; flex-direction:column; overflow:hidden; min-width:0; position:relative; }

  /* attention: only rendered when something needs you */
  #attn { flex:none; border-bottom:1px solid var(--line); padding:14px 20px; display:flex; flex-direction:column; gap:6px; }
  #attn.clear { display:none; }
  .alert { display:flex; align-items:baseline; gap:10px; width:100%; max-width:760px; padding:8px 12px; border-radius:6px; background:var(--red-tint); border:1px solid rgba(221,50,63,.25); color:var(--fg); }
  .alert.amber { background:rgba(232,163,58,.07); border-color:rgba(232,163,58,.25); }
  .alert .k { flex:none; width:7px; height:7px; border-radius:50%; background:var(--red); transform:translateY(-1px); }
  .alert.amber .k { background:var(--amber); }
  .alert .age { margin-left:auto; flex:none; font-size:12px; color:var(--muted); }
  @media (hover:hover) and (pointer:fine) { .alert:hover { border-color:rgba(221,50,63,.5); } .alert.amber:hover { border-color:rgba(232,163,58,.5); } }
  .alert:active { transform:scale(.99); }

  .convo-head { flex:none; display:flex; align-items:center; gap:10px; padding:10px 20px; border-bottom:1px solid var(--line); min-height:44px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 4px 3px 9px; border-radius:99px; background:var(--ink-3); font-size:12px; color:var(--fg); }
  .chip button { width:18px; height:18px; border-radius:50%; text-align:center; color:var(--muted); line-height:18px; }
  @media (hover:hover) and (pointer:fine) { .chip button:hover { background:var(--line); color:var(--fg); } }
  #q { margin-left:auto; width:200px; padding:6px 10px; border-radius:6px; border:1px solid transparent; background:var(--ink-2); color:var(--fg); font:13px/1 var(--ui); outline:none; }
  #q:focus { border-color:var(--line); }
  #q::placeholder { color:var(--muted-2); }

  /* conversation: chronological, reads top to bottom */
  #feed { flex:1; overflow-y:auto; padding:8px 0 24px; }
  .msg { max-width:760px; padding:10px 20px; scroll-margin:40px; }
  .msg.open { box-shadow:inset 2px 0 0 var(--red); }
  .msg.stale { opacity:.4; }
  .msg.flash { background:var(--ink-2); }
  .head { display:flex; align-items:baseline; gap:6px; font-size:13px; }
  .who { font-weight:600; color:var(--c); }
  .to { color:var(--muted-2); }
  .to .who { font-weight:500; }
  .time { margin-left:auto; padding-left:12px; font-size:12px; color:var(--muted-2); font-variant-numeric:tabular-nums; }
  .await { font-size:12px; color:var(--red); }
  .text { margin-top:3px; color:var(--text); white-space:pre-wrap; word-break:break-word; }
  .text.clamp { cursor:pointer; }
  .more { margin-top:2px; font-size:12px; color:var(--muted); }
  @media (hover:hover) and (pointer:fine) { .more:hover { color:var(--fg); } }
  .sep { max-width:760px; margin:14px 20px 6px; font-size:12px; color:var(--muted-2); }

  .jump { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); padding:6px 12px; border-radius:99px; background:var(--fg); color:var(--ink); font-size:12px; font-weight:600; display:none; box-shadow:0 4px 16px rgba(0,0,0,.5); }
  .jump.on { display:block; }

  .empty { padding:48px 20px; color:var(--muted-2); font-size:13px; }

  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }

  @media (max-width:760px) {
    .summary { display:none; }
    .main { grid-template-columns:minmax(0,1fr); grid-template-rows:auto 1fr; }
    aside { border-right:0; border-bottom:1px solid var(--line); max-height:32vh; padding:10px 6px; }
    .topbar, .convo-head, #attn, .msg { padding-left:16px; padding-right:16px; }
    #q { width:140px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="logo">gang</span>
    <span class="summary" id="summary"></span>
    <span class="spacer"></span>
    <span class="conn" id="conn"><i></i><span id="conn-label">connecting</span></span>
  </div>

  <div class="main">
    <aside><span class="cap">Squad</span><div id="members"></div></aside>
    <main>
      <div id="attn" class="clear"></div>
      <div class="convo-head">
        <span class="cap" id="convo-title">Conversation</span>
        <span class="chip" id="who-chip" hidden><span class="dot" id="who-dot"></span><span id="who-name"></span><button id="who-clear" aria-label="Show everyone">×</button></span>
        <input id="q" type="search" placeholder="Search  /" autocomplete="off" spellcheck="false" />
      </div>
      <div id="feed"></div>
      <button class="jump" id="jump">↓ New messages</button>
    </main>
  </div>

<script>
// ponytail: client-only view model; the broker already sends ids, replyTo, supersedes and context usage.
const QUIET_MS = 5 * 60_000;     // busy with no status change this long → surface it
const CTX_WARN = 80;             // context % worth interrupting for
const MAX_FEED = 500;
const PALETTE = ["#7cc4f5", "#b79cf2", "#5fd4c0", "#e6c36a", "#f28bb8", "#a8d672", "#f5a97c", "#9fb4ff"];

const members = new Map();       // sessionId -> SessionInfo
let feed = [];                   // oldest → newest
const expanded = new Set();
const colors = new Map();        // member key -> colour, assigned in order of appearance
let who = null, query = "", online = null;

const $ = (id) => document.getElementById(id);
const membersEl = $("members"), feedEl = $("feed"), attnEl = $("attn"), q = $("q"), jumpBtn = $("jump");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const keyOf = (s) => s.name || s.id;                    // what the broker puts in from/to
const memberByKey = (k) => [...members.values()].find((s) => keyOf(s) === k);
const project = (cwd) => (cwd || "").replace(/\/+$/, "").split("/").pop();
function kind(st){ st = st || ""; return st.startsWith("tool:") ? "tool" : st.startsWith("thinking") ? "thinking" : st.startsWith("idle") ? "idle" : ""; }
function dur(ms){
  const s = Math.max(0, Math.floor(ms/1000)); if (s < 60) return s+"s";
  const m = Math.floor(s/60); if (m < 60) return m+"m";
  const h = Math.floor(m/60); return h < 24 ? h+"h" : Math.floor(h/24)+"d";
}
const tok = (n) => n >= 1000 ? Math.round(n/1000)+"k" : String(n);
const clock = (ts) => new Date(ts).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", hour12:false });

/* Generated names like "subagent-chat-01a0ef29-d44c-769a" → "769a". Human names stay as-is. */
function label(k){
  const m = /^(.*?)[-_]?((?:[0-9a-f]{4,}-)+([0-9a-f]{4,}))$/i.exec(k || "");
  return m ? m[3].slice(-4).toLowerCase() : (k || "?");
}
function color(k){ if (!colors.has(k)) colors.set(k, PALETTE[colors.size % PALETTE.length]); return colors.get(k); }
const whoHtml = (k) => `<span class="who" style="--c:${color(k)}" title="${esc(k)}">${esc(label(k))}</span>`;

/* Open asks = expectsReply with no reply, not superseded by a retry/edit. */
function index(){
  const answered = new Set(), superseded = new Set();
  for (const m of feed){
    if (m.replyTo) answered.add(m.replyTo);
    if (m.supersedes) superseded.add(m.supersedes);
    if (m.retryOf) superseded.add(m.retryOf);
  }
  return { superseded, isOpen: (m) => m.expectsReply && !answered.has(m.id) && !superseded.has(m.id) };
}

function stateOf(s, now){
  const k = kind(s.status), since = s.lastActivity ? now - s.lastActivity : 0;
  const busy = k === "tool" || k === "thinking";
  const text = k === "tool" ? s.status.slice(5) || "tool" : k || s.status || "unknown";
  return { k, busy, text, stuck: busy && since > QUIET_MS, since };
}

/* The only things worth interrupting for, most urgent first. */
function attention(ix, now){
  const out = [];
  for (const m of feed) if (ix.isOpen(m)) out.push({
    level:"red", ts:m.ts, id:m.id, focus:m.to,
    html:`${whoHtml(m.to)} hasn't replied to ${whoHtml(m.from)}`, age: dur(now - m.ts),
  });
  for (const s of members.values()){                     // one line per member, reasons joined
    const st = stateOf(s, now), k = keyOf(s), why = [];
    if (st.stuck) why.push(`on <b>${esc(st.text)}</b> with no update for ${dur(st.since)}`);
    if ((s.contextPct ?? 0) >= CTX_WARN) why.push(`context ${s.contextPct}% full`);
    if (why.length) out.push({ level:"amber", focus:k, html:`${whoHtml(k)} ${why.join(" · ")}`, age:"" });
  }
  return out;
}

function render(){
  const now = Date.now(), ix = index();

  // top summary: one sentence
  const busy = [...members.values()].filter((s) => stateOf(s, now).busy).length;
  $("summary").textContent = members.size ? `${members.size} member${members.size > 1 ? "s" : ""} · ${busy} working` : "";

  // attention
  const items = attention(ix, now);
  attnEl.classList.toggle("clear", items.length === 0);
  attnEl.innerHTML = items.map((a, i) =>
    `<button class="alert ${a.level === "amber" ? "amber" : ""}" data-i="${i}"><span class="k"></span><span>${a.html}</span><span class="age num">${a.age}</span></button>`).join("");
  attnEl._items = items;

  // squad
  const owes = new Set(feed.filter(ix.isOpen).map((m) => m.to));
  const list = [...members.values()].sort((a, b) => keyOf(a).localeCompare(keyOf(b)));
  list.forEach((s) => color(keyOf(s)));
  membersEl.innerHTML = list.length ? list.map((s) => {
    const k = keyOf(s), st = stateOf(s, now), sel = who === k;
    const hot = owes.has(k), warn = st.stuck || (s.contextPct ?? 0) >= CTX_WARN;
    const state = hot ? "owes reply" : st.stuck ? `stuck ${dur(st.since)}` : st.text;
    const pct = typeof s.contextPct === "number" ? `${s.contextPct}% context${s.contextWindow ? ` (${tok(s.contextTokens || 0)}/${tok(s.contextWindow)})` : ""}` : "";
    return `<button class="member${sel ? " sel" : ""}" data-who="${esc(k)}" title="${esc(k)}">
        <span class="dot" style="--c:${color(k)}"></span>
        <span class="m-body"><div class="m-name">${esc(label(k))}</div><div class="m-sub">${esc(project(s.cwd))}</div></span>
        <span class="m-state ${hot ? "hot" : warn ? "warn" : st.busy ? "busy" : ""}">${esc(state)}</span>
      </button>` + (sel ? `<div class="m-detail">
        <div>${esc(s.model || "")}</div><div title="${esc(s.cwd)}">${esc(s.cwd || "")}</div>
        <div>${[pct, s.startedAt ? "up " + dur(now - s.startedAt) : "", s.tmuxPane ? "pane " + s.tmuxPane : ""].filter(Boolean).map(esc).join(" · ")}</div>
      </div>` : "");
  }).join("") : `<div class="empty">No one yet.<br>gang spawn &lt;role&gt; &lt;task&gt;</div>`;

  // filter chip
  $("who-chip").hidden = !who;
  if (who){ $("who-dot").style.setProperty("--c", color(who)); $("who-name").textContent = label(who); }
}

function renderFeed(stick){
  const ix = index(), ql = query.toLowerCase();
  const shown = feed.filter((m) =>
    (!who || m.from === who || m.to === who) &&
    (!ql || `${m.from} ${m.to} ${label(m.from)} ${label(m.to)} ${m.text}`.toLowerCase().includes(ql)));

  const atBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60;
  const top = feedEl.scrollTop;

  if (!shown.length){
    feedEl.innerHTML = `<div class="empty">${feed.length ? "Nothing matches." : online === false ? "Can't reach the broker." : "No messages yet."}</div>`;
  } else {
    let lastDay = "";
    feedEl.innerHTML = shown.map((m) => {
      const day = new Date(m.ts).toDateString();
      const sep = day !== lastDay && lastDay ? `<div class="sep">${esc(new Date(m.ts).toLocaleDateString([], { weekday:"long", month:"short", day:"numeric" }))}</div>` : "";
      lastDay = day;
      const open = ix.isOpen(m), ex = expanded.has(m.id), prev = preview(m.text), long = prev !== (m.text || "");
      return sep + `<div class="msg${open ? " open" : ""}${ix.superseded.has(m.id) ? " stale" : ""}" id="m-${esc(m.id)}">
        <div class="head">${whoHtml(m.from)}<span class="to">to ${whoHtml(m.to)}</span>${open ? `<span class="await">· waiting for reply</span>` : ""}
          <span class="time" title="${esc(new Date(m.ts).toLocaleString())}">${clock(m.ts)}</span></div>
        <div class="text${long && !ex ? " clamp" : ""}" data-more="${long ? esc(m.id) : ""}">${esc(ex ? m.text : prev)}</div>
        ${long ? `<button class="more" data-more="${esc(m.id)}">${ex ? "Less" : "More"}</button>` : ""}
      </div>`;
    }).join("");
  }
  if (stick || atBottom){ feedEl.scrollTop = feedEl.scrollHeight; jumpBtn.classList.remove("on"); }
  else feedEl.scrollTop = top;
}

/* First ~4 lines / 320 chars, cut at a word boundary. */
function preview(t){
  t = t || "";
  let cut = t.split("\n").slice(0, 4).join("\n");
  if (cut.length > 320) cut = cut.slice(0, 320).replace(/\s+\S*$/, "");
  cut = cut.trimEnd();
  return cut.length < t.trimEnd().length ? cut + " …" : t;
}

function norm(m){ return { ...m, ts: typeof m.ts === "number" ? m.ts : Date.now() }; }

/* ── interactions ─────────────────────────────────────────────── */
function focusWho(k){ who = k; render(); renderFeed(true); }
membersEl.onclick = (e) => { const b = e.target.closest("[data-who]"); if (b) focusWho(who === b.dataset.who ? null : b.dataset.who); };
$("who-clear").onclick = () => focusWho(null);
attnEl.onclick = (e) => {
  const b = e.target.closest("[data-i]"); if (!b) return;
  const a = attnEl._items[Number(b.dataset.i)];
  if (!a.id){ focusWho(a.focus); return; }
  who = null; query = ""; q.value = ""; render(); renderFeed(true);
  const el = document.getElementById("m-" + a.id); if (!el) return;
  el.scrollIntoView({ block:"center" });
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200);
};
feedEl.onclick = (e) => {
  const t = e.target.closest("[data-more]"); if (!t || !t.dataset.more || getSelection().toString()) return;
  const id = t.dataset.more; expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderFeed();
};
feedEl.onscroll = () => { if (feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60) jumpBtn.classList.remove("on"); };
jumpBtn.onclick = () => { feedEl.scrollTop = feedEl.scrollHeight; jumpBtn.classList.remove("on"); };
q.oninput = () => { query = q.value.trim(); renderFeed(true); };
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q){ e.preventDefault(); q.focus(); }
  else if (e.key === "Escape"){ q.value = ""; query = ""; q.blur(); focusWho(null); }
});

/* ── live feed ────────────────────────────────────────────────── */
function setOnline(v){
  online = v;
  $("conn").className = "conn " + (v ? "live" : "down");
  $("conn-label").textContent = v ? "live" : "disconnected";
}
const es = new EventSource("/events");
es.onopen = () => setOnline(true);
es.onerror = () => { setOnline(false); renderFeed(); };
es.onmessage = (e) => {
  let ev; try { ev = JSON.parse(e.data); } catch { return; }
  switch (ev.type){
    case "snapshot":
      members.clear(); (ev.sessions || []).forEach((s) => members.set(s.id, s));
      feed = (ev.feed || []).map(norm);
      render(); renderFeed(true); return;
    case "session_joined":
    case "presence_update": members.set(ev.session.id, ev.session); render(); return;
    case "session_left":    members.delete(ev.sessionId); render(); return;
    case "message": {
      feed.push(norm(ev)); if (feed.length > MAX_FEED) feed.shift();
      const atBottom = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 60;
      render(); renderFeed();
      if (!atBottom) jumpBtn.classList.add("on");
      return;
    }
  }
};

render(); renderFeed(true);
setInterval(render, 5000);   // ages and "stuck" detection; nothing here needs per-second updates
</script>
</body>
</html>
